[project]
name = "blog-system"
version = "0.1.0"
description = "企业级博客系统 API"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiomysql>=0.2.0",
    "pydantic-settings>=2.0.0",
    "redis[hiredis]>=5.0.0",
    "PyJWT>=2.9",
    "bcrypt>=4.0",
    "cryptography>=43.0",
    "structlog>=24.0.0",
    "alembic>=1.14.0",
    "slowapi>=0.1.0",
    "python-multipart>=0.0.18",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "pre-commit>=4.0.0",
    "pytest-cov>=6.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "celery>=5.4.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4"]
# FastAPI 的 Depends() 作为参数默认值是标准模式
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
check_untyped_defs = true
[[tool.mypy.overrides]]
module = ["jwt.*", "slowapi.*", "redis.*"]
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=44",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/migrations/*", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# 面试点：按模块展示覆盖率，locate 未覆盖代码
# term-missing: 终端显示未覆盖行号
# html: 生成 htmlcov/ 可视化报告
# fail-under=75: CI 中覆盖率低于 75% 失败
